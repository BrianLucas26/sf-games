name: Keep Supabase project awake

# Supabase free-tier projects pause after 7 days with no API activity.
# A daily read-only ping keeps this one active with a wide safety margin.
# Requires a SUPABASE_PUBLISHABLE_KEY repository secret (Settings -> Secrets
# and variables -> Actions) -- same value as VITE_SUPABASE_PUBLISHABLE_KEY
# in .env.local.
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf "https://hhectckjwozmulhnrwdt.supabase.co/rest/v1/game_types?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
