# Local Supabase CLI config. Run `npx supabase init` to have the CLI
# regenerate this against your installed CLI version if fields look stale,
# then `npx supabase link --project-ref <ref>` to connect to the hosted project.
project_id = "sf-games"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[realtime]
enabled = true

[storage]
enabled = true

[edge_runtime]
enabled = true
